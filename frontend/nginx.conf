# 业务 API 上游服务组
upstream api_backend {
    zone api_zone 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Agent 运行时上游服务组
upstream agent_backend {
    zone agent_zone 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server agent:8001 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单文件最大上传体积
    client_max_body_size 100m;

    # 代理通用头与连接复用配置
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 代理超时与上游重试策略
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # Gzip 静态资源压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 长连接与流式问答代理至 Agent 运行时
    location ~ ^/api/v1/(conversations|retrieval-debug|knowledge-bases/[^/]+/conversations) {
        proxy_pass http://agent_backend;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # 业务 API 请求代理
    location /api {
        proxy_pass http://api_backend;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查代理
    location /health {
        proxy_pass http://api_backend;
    }

    # 前端静态资源强缓存一年
    location /assets/ {
        expires 1y;
    }

    # SPA 入口文件禁止缓存
    location = /index.html {
        expires -1;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}
