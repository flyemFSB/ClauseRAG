# Alembic configuration for the business PostgreSQL schema.
#
# The logging sections are intentionally absent: `backend/migrations/env.py` configures its own
# logging and never calls `logging.config.fileConfig`, which would require every logger, handler
# and formatter section to be present. The database URL is read from `DATABASE_URL` by env.py.
#
#   uv run alembic upgrade head
#   uv run alembic downgrade base

[alembic]
script_location = backend/migrations
# Puts the application's top-level packages on the path so env.py can expose the ORM metadata to
# autogenerate.
prepend_sys_path = backend/src
version_path_separator = os
