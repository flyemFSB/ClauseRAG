# web: the SPA, and the single origin the browser talks to.
#
# ADR-0020 splits the HTTP surface into two processes — the business API (knowledge bases, documents,
# ingestion jobs, health) and the agent runtime (conversations, the streamed run, retrieval
# diagnostics). This file is the deployment's half of what `frontend/vite.config.ts` does for the
# development server: route those prefixes to the two backends, serve the SPA for everything else, and
# keep the order — the nested conversation-create route has to be matched before the `/api` catch-all,
# exactly as it is declared before it there.
#
# Both backends are named by their Compose service, so this container must start after them; the
# `depends_on: service_healthy` in `infra/compose.yaml` is what makes nginx's startup resolution work.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must not be smaller than MAX_UPLOAD_BYTES, or nginx answers 413 before the API's own bound
    # is ever reached and the API's readable error is replaced by nginx's.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The streamed run is a long-lived response: buffering would hold frames back instead of
    # forwarding them, and the read timeout has to outlast the agent runtime's own budget
    # (ANSWER_TIMEOUT_SECONDS, 300 by default).
    location ~ ^/api/v1/(conversations|retrieval-debug|knowledge-bases/[^/]+/conversations) {
        proxy_pass http://agent:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Vite writes content-hashed names under /assets, so they can be cached for a year; the shell that
    # names them must not be, or a deploy would keep pointing at the previous build's chunks.
    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}
